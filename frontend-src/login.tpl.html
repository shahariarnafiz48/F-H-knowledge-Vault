<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Fiber@Home Knowledge Vault</title><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light">
<style>
@font-face{font-family:Outfit;font-weight:100 900;font-style:normal;font-display:swap;src:url(data:font/woff2;base64,__OUTFIT__) format("woff2")}
:root{--navy:#101D30;--red:#CE242B;--ink:#101D30;--mut:#4B525B;--line:#D2D5DA;--f:Outfit,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:var(--f);color:var(--ink);background:var(--navy);min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px 16px;position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(900px 560px at 15% 10%,rgba(206,36,43,.20),transparent 60%),radial-gradient(800px 600px at 90% 95%,rgba(60,110,190,.22),transparent 60%),linear-gradient(160deg,#0B172A,#101D30 55%,#182536);z-index:0}
.trail{position:fixed;height:2px;width:36vw;left:-40vw;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);opacity:.0;z-index:0;animation:run 7s linear infinite}
.trail.r{background:linear-gradient(90deg,transparent,#E8434A,transparent)}
.t1{top:22%;animation-delay:0s}.t2{top:41%;animation-delay:2.2s;width:28vw}.t3{top:63%;animation-delay:4.1s}.t4{top:81%;animation-delay:5.6s;width:22vw}
@keyframes run{0%{transform:translateX(0);opacity:0}10%{opacity:.7}80%{opacity:.5}100%{transform:translateX(190vw);opacity:0}}
main{position:relative;z-index:1;width:100%;max-width:420px}
.card{background:#fff;border-radius:20px;padding:30px 28px 22px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.logo{display:block;height:46px;width:auto;margin:0 0 14px}
.brand{font:600 11px/1 var(--f);letter-spacing:.22em;text-transform:uppercase;color:#6B7078;display:flex;align-items:center;gap:10px;margin-bottom:14px}.brand:after{content:"";flex:1;height:1px;background:#E2E3E5}
h1{font:600 clamp(14px,4.7vw,22px)/1.25 var(--f);margin:0 0 16px;white-space:nowrap}
label{display:block;font:600 13px/1.2 var(--f);margin:12px 0 6px}
.fld{display:flex;align-items:center;gap:10px;background:#F2F3F5;border:1px solid var(--line);border-radius:12px;padding:0 14px;height:52px}
.fld svg{width:18px;height:18px;flex:none;fill:none;stroke:#CE242B;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fld input{all:unset;flex:1;min-width:0;font:400 15px var(--f);color:var(--ink)}.fld input::placeholder{color:#6B7078}
.fld:focus-within{background:#fff;border-color:var(--red);box-shadow:0 0 0 4px rgba(206,36,43,.16)}
.go{all:unset;box-sizing:border-box;width:100%;margin-top:18px;height:52px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:12px;background:linear-gradient(#D82A31,#B81F26);color:#fff;font:600 15px var(--f);cursor:pointer;box-shadow:0 8px 20px rgba(206,36,43,.28)}
.go:hover{filter:brightness(1.05)}.go:focus-visible,a:focus-visible,.lk:focus-visible{outline:3px solid var(--navy);outline-offset:2px}.go[disabled]{opacity:.7;cursor:progress}
.go svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
h2{font:600 18px/1.3 var(--f);margin:6px 0 4px;outline:none}.p{margin:0 0 14px;font:400 13.5px/1.5 var(--f);color:var(--mut)}.p b{color:var(--ink);word-break:break-all}
.row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.row input{width:100%;min-width:0;height:54px;text-align:center;font:600 22px var(--f);color:var(--ink);background:#F2F3F5;border:1px solid var(--line);border-radius:12px;padding:0;caret-color:var(--red)}
.row input:focus{background:#fff;border-color:var(--red);box-shadow:0 0 0 4px rgba(206,36,43,.16);outline:none}.row input[aria-invalid=true],.fld[data-bad]{border-color:#B3261E}
.links{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.lk{all:unset;cursor:pointer;font:500 13px var(--f);color:var(--mut);padding:4px 2px;border-radius:6px}.lk.red{color:#B81F26;font-weight:600}.lk:disabled{color:#6B7078;cursor:default;font-weight:500}.lk:hover:not(:disabled){text-decoration:underline}
.err{min-height:20px;margin-top:10px;font:500 13px/1.45 var(--f);color:#B3261E}
.sec{list-style:none;margin:14px 0 0;padding:14px 0 0;border-top:1px solid #E2E3E5;display:grid;gap:8px}.sec li{display:flex;align-items:center;gap:10px;font:500 13px var(--f);color:#252A31}.sec svg{width:16px;height:16px;fill:none;stroke:#CE242B;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.foot{margin:14px 0 0;padding-top:12px;border-top:1px solid #E2E3E5;text-align:center;font:400 11.5px/1.4 var(--f);color:#4B525B}
.tag{position:relative;z-index:1;margin:22px 0 0;text-align:center;font:500 15px/1.4 var(--f);color:#E2E3E5;letter-spacing:.04em}.tag .w{display:inline-block;opacity:0;transform:translateY(6px);animation:in .7s ease forwards;animation-delay:calc(var(--i)*.18s + .3s)}.tag .hl{color:#fff;text-shadow:0 0 14px rgba(255,255,255,.7),0 0 28px rgba(206,36,43,.9)}
@keyframes in{to{opacity:1;transform:none}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.trail{display:none}.tag .w{animation:none;opacity:1;transform:none}}
@media (max-width:300px){h1{white-space:normal}}
@media (max-width:380px){.card{padding:24px 18px 18px}.row{gap:6px}}
</style></head><body>
<div class="bg" aria-hidden="true"></div><i class="trail t1" aria-hidden="true"></i><i class="trail r t2" aria-hidden="true"></i><i class="trail t3" aria-hidden="true"></i><i class="trail r t4" aria-hidden="true"></i>
<main>
<form class="card" id="f" novalidate aria-labelledby="title">
 <img class="logo" src="data:image/png;base64,__LOGO__" alt="Fiber@Home Ltd."><div class="brand">Knowledge Vault</div>
 <h1 id="title">Welcome to F@H Knowledge Vault</h1>
 <div id="s1"><label for="em">Email</label><div class="fld" id="emw"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg><input id="em" type="email" autocomplete="email" inputmode="email" placeholder="name@fiberathome.net" autofocus aria-describedby="err"></div>
  <button class="go" type="submit" id="send"><span>Send one-time code</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
 <div id="s2" hidden><h2 id="h2" tabindex="-1">Check your email</h2><p class="p" id="p"></p>
  <div class="row" role="group" aria-label="6-digit code"><input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1 of 6"><input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 2 of 6"><input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 3 of 6"><input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 4 of 6"><input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 5 of 6"><input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="Digit 6 of 6"></div>
  <button class="go" type="button" id="verify"><span>Verify and sign in</span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></button>
  <div class="links"><button type="button" class="lk" id="diff">&larr; Different email</button><button type="button" class="lk red" id="resend">Send a new code</button></div></div>
 <div class="err" id="err" role="alert" aria-live="assertive"></div>
 <ul class="sec" aria-label="Security"><li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/></svg>Secure sign-in gateway</li><li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>TLS-encrypted connection</li><li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M10.5 17.5h3M10 8h4M10 11.5h4"/></svg>OTP-verified identity</li></ul>
 <div class="foot">Developed by Strategy and Automation Team | Technology and Operations</div>
</form>
<p class="tag"><span class="w" style="--i:0">Connecting</span> <span class="w" style="--i:1">Our</span> <span class="w" style="--i:2">Future</span> <span class="w" style="--i:3">With</span> <span class="w hl" style="--i:4">Light</span></p>
</main>
<script>
(function(){
var $=function(s){return document.querySelector(s)},err=$('#err'),em=$('#em'),bx=[].slice.call(document.querySelectorAll('.row input')),st={email:'',resend:30,ttl:10,tm:null,busy:false};
var RE=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
function say(m){err.textContent=m?'Error: '+m:''}
function busy(b,on){st.busy=on;b.disabled=on}
function step(n){$('#s1').hidden=n!==1;$('#s2').hidden=n!==2;setTimeout(function(){if(n===1)em.focus();else{$('#h2').focus({preventScroll:true});bx[0].focus()}},30)}
function clr(){bx.forEach(function(b){b.value='';b.removeAttribute('aria-invalid')})}
function tick(){clearInterval(st.tm);var l=st.resend,b=$('#resend');function u(){b.disabled=l>0;b.textContent=l>0?'Send a new code in '+l+'s':'Send a new code'}u();st.tm=setInterval(function(){l--;u();if(l<=0)clearInterval(st.tm)},1000)}
function post(u,b){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(b)}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){return{ok:r.ok,status:r.status,j:j}})})}
function send(again){
 say('');var e=again?st.email:em.value.trim();em.removeAttribute('aria-invalid');
 if(!e){em.setAttribute('aria-invalid','true');say('Enter your email address, for example name@fiberathome.net.');em.focus();return}
 if(!RE.test(e)){em.setAttribute('aria-invalid','true');say('That email address looks incomplete. Include the @ and the domain, for example name@fiberathome.net.');em.focus();return}
 var b=again?$('#resend'):$('#send');busy(b,true);
 post('/api/auth/otp/request',{email:e}).then(function(r){
  if(r.status===503){say('One-time code sign-in is not set up on the server yet. Please contact IT.');return}
  if(r.status===429){say(typeof r.j.detail==='string'?r.j.detail:'Too many requests. Please wait a moment and try again.');return}
  if(!r.ok){say(r.status===422?'That email address is not valid.':'We could not send the code. Please try again in a moment.');return}
  st.email=e;st.ttl=r.j.ttl_minutes||10;st.resend=r.j.resend_after||30;clr();
  $('#p').innerHTML='If <b></b> has access, a 6-digit code is on its way. It expires in '+st.ttl+' minutes.';$('#p b').textContent=e;step(2);tick();
 }).catch(function(){say('We could not reach the server. Check your connection and try again.')}).then(function(){busy(b,false);if(again)tick()});
}
function verify(){
 if(st.busy)return;say('');var c=bx.map(function(b){return b.value}).join('');bx.forEach(function(b){b.removeAttribute('aria-invalid')});
 if(c.length<6){bx.forEach(function(b){if(!b.value)b.setAttribute('aria-invalid','true')});say('Enter all 6 digits of the code.');(bx.filter(function(b){return!b.value})[0]||bx[0]).focus();return}
 var btn=$('#verify');busy(btn,true);var ok=false;
 post('/api/auth/otp/verify',{email:st.email,code:c}).then(function(r){
  if(!r.ok){say(typeof r.j.detail==='string'?r.j.detail:'That code is incorrect or has expired. Check the code or request a new one.');clr();bx.forEach(function(b){b.setAttribute('aria-invalid','true')});bx[0].focus();return}
  ok=true;try{sessionStorage.setItem('fhl-csrf',r.j.csrf_token)}catch(e){}btn.querySelector('span').textContent='Signing in…';location.replace('/');
 }).catch(function(){say('We could not reach the server. Check your connection and try again.')}).then(function(){if(!ok)busy(btn,false)});
}
$('#f').addEventListener('submit',function(e){e.preventDefault();if(!$('#s1').hidden)send(false);else verify()});
$('#verify').addEventListener('click',verify);$('#resend').addEventListener('click',function(){send(true)});
$('#diff').addEventListener('click',function(){clearInterval(st.tm);clr();say('');step(1)});
bx.forEach(function(b,i){
 b.addEventListener('input',function(){var d=b.value.replace(/\D/g,'');if(d.length>1){d.slice(0,6).split('').forEach(function(c,k){if(bx[i+k])bx[i+k].value=c});bx[Math.min(i+d.length,5)].focus()}else{b.value=d;if(d&&i<5)bx[i+1].focus()}if(bx.every(function(x){return x.value}))verify()});
 b.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!b.value&&i>0){bx[i-1].value='';bx[i-1].focus()}else if(e.key==='ArrowLeft'&&i>0){e.preventDefault();bx[i-1].focus()}else if(e.key==='ArrowRight'&&i<5){e.preventDefault();bx[i+1].focus()}else if(e.key==='Enter'){e.preventDefault();verify()}});
 b.addEventListener('paste',function(e){var t=((e.clipboardData&&e.clipboardData.getData('text'))||'').replace(/\D/g,'').slice(0,6);if(!t)return;e.preventDefault();t.split('').forEach(function(c,k){bx[k].value=c});bx[Math.min(t.length,5)].focus();if(t.length===6)verify()});
 b.addEventListener('focus',function(){b.select()});
});
})();
</script></body></html>
