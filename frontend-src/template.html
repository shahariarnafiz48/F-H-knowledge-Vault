<title>Fiber@Home Limited Knowledge Vault</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:'Outfit';font-style:normal;font-weight:100 900;font-display:swap;src:url(data:font/woff2;base64,__OUTFIT__) format('woff2')}

/* Layout concept: fixed left rail (brand + four workspaces), one working column on the right.
   Brand red from the Fiber@Home logo is the only accent; each department carries a quiet identifying hue. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#f0f2f5; --ink:#161a22; --muted:#596273; --line:#dfe3e9;
  --accent:#c4202b; --accent-ink:#ffffff; --accent-soft:#fbe8ea; --focus:#1f5fbf;
  --ok:#1f7a45; --ok-soft:#e4f4ea; --warn:#9a6200; --warn-soft:#fdf1d8; --bad:#b3261e; --bad-soft:#fbe6e4;
  --d-corp:#2f6fd0; --d-reg:#7a4bc4; --d-net:#0e8577; --d-flow:#b47508; --d-biz:#2c8a3c; --d-fin:#b04a78; --d-scm:#5a6a7c; --d-it:#2f7ba8; --d-ops:#8a6a35; --d-other:#6b7280;
  --f-body:"Outfit",Arial,"Liberation Sans",Helvetica,sans-serif;
  --f-head:"Outfit",Arial,"Liberation Sans",Helvetica,sans-serif;
  --f-mono:"Outfit",Arial,"Liberation Sans",Helvetica,sans-serif;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
  --rail:#0f1d2f; --rail-hover:#182a42; --rail-line:#243650; --rail-ink:#f1f4f8; --rail-muted:#9aa9be; --rail-accent:#8b9cff;
  --hero:#0f1d2f; --hero2:#17304d;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#161b23; --surface2:#1d232d; --ink:#e8ebf0; --muted:#9aa4b4; --line:#2a323e;
  --accent:#ee4b57; --accent-ink:#1a0608; --accent-soft:#3a1b1f; --focus:#6aa2f2;
  --ok:#5cc58a; --ok-soft:#173225; --warn:#e8b04a; --warn-soft:#3a2d12; --bad:#f08a82; --bad-soft:#3b1d1b;
  --d-corp:#6ea2f2; --d-reg:#b394ee; --d-net:#43c4b3; --d-flow:#e5aa3b; --d-biz:#6fc47f; --d-fin:#e58bb4; --d-scm:#9fb0c4; --d-it:#6fb8e0; --d-ops:#cfae72; --d-other:#a0a8b5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#161b23; --surface2:#1d232d; --ink:#e8ebf0; --muted:#9aa4b4; --line:#2a323e;
  --accent:#ee4b57; --accent-ink:#1a0608; --accent-soft:#3a1b1f; --focus:#6aa2f2;
  --ok:#5cc58a; --ok-soft:#173225; --warn:#e8b04a; --warn-soft:#3a2d12; --bad:#f08a82; --bad-soft:#3b1d1b;
  --d-corp:#6ea2f2; --d-reg:#b394ee; --d-net:#43c4b3; --d-flow:#e5aa3b; --d-biz:#6fc47f; --d-fin:#e58bb4; --d-scm:#9fb0c4; --d-it:#6fb8e0; --d-ops:#cfae72; --d-other:#a0a8b5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14.5px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;margin:0;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-head);letter-spacing:.005em;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:600;line-height:1.1;letter-spacing:-.005em}
h1::after{content:"";display:block;width:38px;height:3px;border-radius:2px;background:var(--accent);margin-top:12px}
.eyebrow{font:600 11.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
/* rail */
.side{position:sticky;top:0;height:100vh;background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding:22px 14px 16px;gap:20px;min-width:0}
.brand{display:flex;flex-direction:column;gap:14px;padding:0 6px 20px;border-bottom:1px solid var(--rail-line)}
.logo{width:68px;height:auto;aspect-ratio:156/148;object-fit:contain;background:#fff;border-radius:10px;padding:5px;flex:none;display:block}
.bsub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-accent);font-weight:600}
.bname{font:600 25px/1.05 var(--f-head);color:#fff;margin-top:3px}
.btag{font-size:12px;color:var(--rail-muted);margin-top:6px;line-height:1.35}
.navl{display:flex;flex-direction:column;gap:3px}
.nav{display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:11px 12px;border-radius:9px;color:var(--rail-muted);font-weight:500;width:100%;position:relative}
.nav svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:var(--rail-hover);color:#fff}
.nav[aria-current="page"]{background:var(--rail-hover);color:#fff;font-weight:600}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--rail-accent)}
.nav[aria-current="page"] svg{color:var(--rail-accent)}
.nav .cnt{margin-left:auto;font:500 11px var(--f-mono);background:rgba(255,255,255,.1);color:var(--rail-ink);padding:1px 8px;border-radius:99px}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:9px;font-size:12px;color:var(--rail-muted);padding:16px 6px 0;border-top:1px solid var(--rail-line)}
.stat{display:flex;justify-content:space-between;gap:8px}
.stat b{color:#fff;font-weight:600;font-family:var(--f-mono);font-size:12px}
.themebtn{align-self:flex-start;border:1px solid var(--rail-line);background:none;border-radius:8px;padding:5px 11px;font-size:12px;color:var(--rail-muted);margin-top:4px}
.themebtn:hover{color:#fff;border-color:var(--rail-muted)}
/* main */
main{min-width:0;padding:34px clamp(16px,3.4vw,48px) 40px;max-width:1220px;width:100%}
.pagehead{display:flex;flex-wrap:wrap;gap:14px 24px;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
.pagehead p{color:var(--muted);max-width:64ch;margin-top:12px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:500;display:inline-flex;gap:7px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
input[type=text],input[type=search],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 11px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.chk{display:inline-flex;gap:7px;align-items:center;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.new{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--d-other)}
.dot.corp{background:var(--d-corp)}.dot.reg{background:var(--d-reg)}.dot.net{background:var(--d-net)}.dot.flow{background:var(--d-flow)}.dot.biz{background:var(--d-biz)}.dot.fin{background:var(--d-fin)}.dot.scm{background:var(--d-scm)}.dot.it{background:var(--d-it)}.dot.ops{background:var(--d-ops)}
.ref{font:500 11.5px var(--f-mono);background:var(--surface2);border:1px solid var(--line);color:var(--muted);padding:0 6px;border-radius:5px;white-space:nowrap}
.hero{position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(120deg,var(--hero) 0%,var(--hero2) 100%);color:#fff;padding:26px 28px;display:grid;gap:18px;isolation:isolate}
.hero .fibre{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.9}
.hero h2{font-size:24px;color:#fff;font-weight:600}
.hero p{color:#c3cee0;max-width:62ch}
.hstats{display:flex;flex-wrap:wrap;gap:10px}
.hstat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 16px;min-width:116px;backdrop-filter:blur(3px)}
.hstat b{display:block;font:600 26px/1.1 var(--f-head);color:#fff}
.hstat span{font-size:12px;color:#b3c0d4}
.hero .progress{background:rgba(255,255,255,.16)}
.hero .progress i{background:#4cd08a}
.hero .pill{background:rgba(255,255,255,.12);color:#e6edf7}
.hero .pill.ok{background:rgba(76,208,138,.18);color:#7ee3ac}.hero .pill.warn{background:rgba(255,196,87,.18);color:#ffd27a}

/* ---- 3D / premium layer ---- */
.globe{position:absolute;top:-8%;bottom:-8%;right:-3%;width:60%;z-index:-1;pointer-events:none}
.globe canvas{width:100%;height:100%;display:block}
.hero{min-height:300px;box-shadow:0 18px 50px -22px rgba(8,18,35,.65),inset 0 1px 0 rgba(255,255,255,.08)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 90% at 78% 40%,rgba(255,117,128,.14),transparent 70%),linear-gradient(90deg,rgba(15,29,47,.55) 0%,rgba(15,29,47,0) 55%)}
.hcopy{max-width:54%}
.hero h2{font-size:30px;letter-spacing:-.01em}
.trust{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:#cfe0f5}
.trust span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#4cd08a;margin-right:7px;box-shadow:0 0 8px #4cd08a}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 6px}
.how .step{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px 16px 62px;transition:transform .15s ease,box-shadow .2s ease;transform-style:preserve-3d}
.how .step b{display:block;font:600 14.5px var(--f-head);margin-bottom:3px}
.how .step span{font-size:13px;color:var(--muted);line-height:1.45}
.how .n{position:absolute;left:16px;top:16px;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 15px var(--f-head);color:#fff;background:linear-gradient(135deg,#e5343d,#8b9cff);box-shadow:0 8px 16px -6px rgba(229,52,61,.6);transform:translateZ(18px)}
.tilt{transition:transform .18s ease,box-shadow .25s ease;will-change:transform}
.tilt.on{transition:transform .06s linear,box-shadow .25s ease;box-shadow:0 22px 40px -20px rgba(15,29,47,.45)}
.ring{flex:none;filter:drop-shadow(0 6px 18px rgba(76,208,138,.35))}
.ring text{font:700 22px var(--f-head);fill:#fff}
@media (max-width:760px){.globe{width:100%;right:0;opacity:.32}.hcopy{max-width:none}.how{grid-template-columns:1fr}.hero h2{font-size:24px}}
@media (prefers-reduced-motion:reduce){.tilt,.tilt.on{transition:none}}

/* ---- premium colour layer ---- */
:root{--rail:#08111f;--rail-hover:#13233b;--rail-line:#1f3350;--hero:#08111f;--hero2:#123766;--cy:#19b6d9;--cy-soft:rgba(25,182,217,.14)}
body{background-image:radial-gradient(1100px 520px at 88% -8%,rgba(25,182,217,.10),transparent 62%),radial-gradient(900px 520px at -8% 2%,rgba(196,32,43,.07),transparent 58%)}
.side{background:linear-gradient(180deg,#0b172a 0%,#08111f 55%,#060d18 100%);box-shadow:inset -1px 0 0 rgba(255,255,255,.05),8px 0 40px -20px rgba(0,0,0,.6)}
.logo{box-shadow:0 10px 28px -8px rgba(255,117,128,.45),0 0 0 1px rgba(255,255,255,.4);transition:transform .2s}
.btn.primary{background:linear-gradient(135deg,#d2232f,#f0485a);border-color:transparent;box-shadow:0 8px 18px -8px rgba(229,52,61,.7)}
.btn.primary:hover{filter:none;transform:translateY(-1px);box-shadow:0 12px 22px -8px rgba(229,52,61,.75)}
.card,.dept,.starter,.match{box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 24px -18px rgba(8,17,31,.35)}
.composer form{box-shadow:0 14px 40px -16px rgba(8,17,31,.35),0 0 0 4px rgba(25,182,217,.05)}
.composer form:focus-within{border-color:var(--cy);box-shadow:0 14px 40px -16px rgba(8,17,31,.4),0 0 0 4px var(--cy-soft)}
.nav.searchbtn{border:1px solid var(--rail-line);background:rgba(255,255,255,.04);margin-bottom:6px}
.nav.searchbtn kbd{margin-left:auto;font:500 10.5px var(--f-mono);border:1px solid var(--rail-line);border-radius:5px;padding:1px 6px;color:var(--rail-muted)}
.hero{background:linear-gradient(120deg,#08111f 0%,#0e2a50 60%,#123766 100%)}
/* ---- command palette ---- */
#cmdk{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(6,13,24,.55);backdrop-filter:blur(6px)}
#cmdk .box{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 40px 90px -20px rgba(0,0,0,.6);overflow:hidden;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}}
#cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);padding:18px 20px;font-size:16px;background:none;outline:none;border-radius:0}
#cmdk .list{max-height:52vh;overflow:auto;padding:8px;display:grid;gap:2px}
#cmdk .it{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;border:0;background:none;border-radius:10px;padding:10px 12px}
#cmdk .it[aria-selected="true"]{background:var(--accent-soft)}
#cmdk .it b{display:block;font-weight:600}
#cmdk .it span.s{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
#cmdk .it .dot{margin-top:7px}
#cmdk .hd{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px}
#cmdk .ft{display:flex;gap:16px;padding:9px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
/* ---- feedback / actions ---- */
.fb{display:inline-flex;gap:4px;align-items:center}
.fb .btn{padding:3px 9px}.fb .btn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.fb .btn.on.dn{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.rel{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rel .lbl{margin:0 4px 0 0}
.rel button{font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;text-align:left}
.rel button:hover{border-color:var(--cy);color:var(--cy)}
.trustpill{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--cy-soft);color:var(--cy)}
#mic{border:1px solid var(--line);background:var(--surface2);border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none}
#mic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
#mic.rec{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(229,52,61,.18)}}
/* ---- insights ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,var(--cy))}
.kpi b{display:block;font:600 30px/1.1 var(--f-head)}.kpi span{font-size:12.5px;color:var(--muted)}
.ins{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-bottom:16px}
.col3{display:flex;align-items:flex-end;justify-content:space-around;gap:6px;height:230px;padding:26px 8px 0;perspective:900px;border-bottom:1px solid var(--line);position:relative}
.c3{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:1;min-width:0}
.c3 .v{font:600 13px var(--f-mono);margin-bottom:6px}
.bar3{position:relative;width:min(34px,70%);height:var(--h);background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 70%,#000));animation:grow .9s cubic-bezier(.2,.8,.2,1) both;margin-right:10px}
.bar3::before{content:"";position:absolute;left:100%;top:0;width:10px;height:100%;background:color-mix(in srgb,var(--c) 55%,#000);transform-origin:top left;transform:skewY(-45deg)}
.bar3::after{content:"";position:absolute;left:0;bottom:100%;width:100%;height:10px;background:color-mix(in srgb,var(--c) 70%,#fff);transform-origin:bottom left;transform:skewX(-45deg)}
@keyframes grow{from{height:0}}
.lbls{display:flex;justify-content:space-around;gap:6px;padding:8px 8px 0}.lbls span{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis}
.tq{display:grid;gap:8px;margin:0;padding:0;list-style:none}.tq li{display:flex;gap:10px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
/* ---- 3D map ---- */
.mapstage{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(70% 90% at 50% 45%,#12305a 0%,#08111f 75%);box-shadow:0 30px 70px -30px rgba(8,17,31,.8);height:min(66vh,560px);min-height:380px;cursor:grab;touch-action:none}
.mapstage:active{cursor:grabbing}
.mapcanvas{position:absolute;inset:0}.mapcanvas canvas{width:100%;height:100%;display:block}
.klabel{position:absolute;left:0;top:0;border:1px solid rgba(255,255,255,.22);background:rgba(8,17,31,.72);backdrop-filter:blur(4px);color:#fff;border-radius:99px;padding:3px 11px 3px 8px;font-size:12px;font-weight:600;white-space:nowrap;display:flex;gap:7px;align-items:center;will-change:transform}
.klabel:hover{background:rgba(255,255,255,.18)}.klabel i{font:500 11px var(--f-mono);opacity:.75;font-style:normal}
.maplegend{position:absolute;left:14px;bottom:12px;color:#aebcd3;font-size:12px;display:flex;gap:14px;flex-wrap:wrap;pointer-events:none}
.mapnote{margin-top:10px}
@media (max-width:860px){.ins{grid-template-columns:1fr}.mapstage{height:60vh}}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;color:var(--muted);font-size:12px}
.foot b{color:var(--accent);font-weight:600}
.av{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.av img{width:24px;height:auto;display:block}
.msg.bot{flex-direction:row;gap:12px;align-items:flex-start;max-width:900px}
.msg.bot .mb{display:grid;gap:9px;min-width:0;flex:1}
.formcard{border-top:3px solid var(--accent)}
.dept::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:4px;border-radius:12px 12px 0 0;background:var(--dc,var(--line))}
.dept{min-height:122px;align-content:start}
.covgrid .cov{border-top:3px solid var(--dc,var(--line))}
/* chat */
.chatwrap{display:flex;flex-direction:column;min-height:calc(100vh - 150px)}
#msgs{display:flex;flex-direction:column;gap:18px;flex:1;padding-bottom:18px}
.empty{display:grid;gap:18px}
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.starter{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;line-height:1.4}
.starter:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.starter .dot{margin-top:6px}
.msg{display:flex;flex-direction:column;gap:8px;max-width:820px}
.msg.user{max-width:760px}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.user .bubble{background:var(--rail);color:#fff;border-radius:14px 14px 3px 14px;padding:9px 14px;white-space:pre-wrap}
.msg.bot .bubble{background:var(--surface);border:1px solid var(--line);border-radius:3px 14px 14px 14px;padding:14px 18px;box-shadow:var(--shadow)}
.bubble p+p,.bubble ul+p,.bubble p+ul,.bubble ol+p,.bubble p+ol{margin-top:9px}
.bubble ul,.bubble ol{margin:6px 0;padding-left:22px}
.bubble li+li{margin-top:3px}
.bubble code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:4px}
.cite{font:500 11px var(--f-mono);border:1px solid var(--line);background:var(--surface2);color:var(--accent);border-radius:5px;padding:0 5px;margin:0 1px;vertical-align:1px}
.cite:hover{border-color:var(--accent)}
.thinking{display:flex;align-items:center;gap:9px;color:var(--muted)}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.1s infinite ease-in-out}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.srcs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.srcs .lbl{margin-right:2px}
.srcchip{display:inline-flex;gap:7px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 9px 3px 8px;font-size:12px;max-width:100%}
.srcchip:hover{border-color:var(--accent)}
.srcchip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.msgactions{display:flex;gap:8px;flex-wrap:wrap}
.match{border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--surface2);display:grid;gap:5px}
.match+.match{margin-top:8px}
.composer{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:14px 0 max(12px,env(safe-area-inset-bottom,0px))}
.composer form{display:flex;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:9px 9px 9px 18px;box-shadow:0 6px 24px rgba(16,24,40,.09)}
.composer form:focus-within{border-color:var(--focus)}
.composer textarea{border:0;background:none;padding:7px 0;resize:none;max-height:150px;box-shadow:none!important}
.composer textarea:focus{box-shadow:none;border:0}
.hint{font-size:12px;color:var(--muted);margin-top:7px;text-align:center}
/* vault */
.deptgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:22px}
.dept{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:grid;gap:6px;position:relative}
.dept:hover{border-color:var(--muted)}
.dept[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dept .nm{display:flex;gap:8px;align-items:center;font-weight:600;line-height:1.25}
.dept .big{font:600 24px var(--f-head)}
.dept .big small{font:500 13px var(--f-body);color:var(--muted);margin-left:2px}
.dept .poc{font-size:12px;color:var(--muted);line-height:1.35}
.dept.zero{background:transparent;border-style:dashed}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
.bar .grow{flex:1 1 260px}
details.comp{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.comp>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;gap:10px;align-items:center}
details.comp>summary::-webkit-details-marker{display:none}
details.comp>summary::before,details.entry>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);flex:none;transition:transform .15s;margin:0 4px 0 2px}
details.entry>summary::before{margin-top:9px}
details[open]>summary::before{transform:rotate(45deg)}
details.comp>summary .ttl{font-weight:600;flex:1;min-width:0}
.cbody{padding:2px 16px 14px;display:grid;gap:12px}
.subhead{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 2px}
details.entry{border-top:1px solid var(--line)}
details.entry>summary{list-style:none;cursor:pointer;padding:9px 2px;display:flex;gap:9px;align-items:flex-start}
details.entry>summary .et{flex:1;min-width:0;line-height:1.4}
.ebody{padding:2px 4px 14px 20px;display:grid;gap:10px}
.ebody .txt{white-space:pre-wrap;max-width:88ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);align-items:center}
.srctable{width:100%;border-collapse:collapse;font-size:13px}
.srctable th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line)}
.srctable td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll-x{overflow-x:auto}
/* coverage */
.phases{display:grid;gap:22px}
.covgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.cov{display:grid;gap:10px;align-content:start}
.cov .head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bl{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.bl li{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.4;padding:3px 0}
.bl button.tick{border:0;background:none;padding:1px 0 0;flex:none;display:flex}
.bl button.tick[disabled]{cursor:default}
.ic{width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:none;border:1.5px solid var(--line);color:transparent}
.ic.y{background:var(--ok);border-color:var(--ok);color:#fff}
.ic.p{background:linear-gradient(90deg,var(--warn) 50%,transparent 50%);border-color:var(--warn)}
.ic.n{border-color:var(--muted)}
.future{display:grid;gap:8px}
.future li{list-style:none;display:flex;gap:9px}
.note{display:grid;gap:6px;border-left:3px solid var(--warn);padding:9px 14px;background:var(--warn-soft);border-radius:0 8px 8px 0}
.note+.note{margin-top:8px}
/* update center */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{border:0;background:none;padding:9px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.list{display:grid;gap:10px}
.item{display:grid;gap:7px}
.item .top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.item .txt{white-space:pre-wrap;max-width:90ch;color:var(--ink)}
.draft{display:grid;gap:10px}
.empty-note{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);margin-bottom:16px;color:var(--muted)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
/* drawer, toast */
#scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px)}
#drawer .dh{display:flex;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);align-items:flex-start}
#drawer .db{padding:16px 18px;overflow:auto;display:grid;gap:14px;align-content:start;padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
#drawer .txt{white-space:pre-wrap}
#toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:60;box-shadow:var(--shadow);max-width:90vw}
mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:10px 14px;border-right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand{flex-direction:row;align-items:center;border-bottom:0;padding:0;gap:12px}.logo{width:48px}.bname{font-size:19px}.btag{display:none}
  .nav[aria-current="page"]::before{display:none}.nav{padding:8px 12px}
  h1{font-size:26px}.hero{padding:20px 18px}.hstat{min-width:0;flex:1 1 40%}
  .navl{flex-direction:row;overflow-x:auto;width:100%;order:3;gap:4px;padding-bottom:2px}
  .nav{width:auto;white-space:nowrap;padding:8px 11px}.nav .cnt{display:none}
  .sidefoot{display:none}
  main{padding-top:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .form{grid-template-columns:minmax(0,1fr)}
  .covgrid{grid-template-columns:minmax(0,1fr)}
  .chatwrap{min-height:calc(100vh - 230px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ======== v7 DESIGN SYSTEM: indigo / teal / amber, block layout ======== */
:root{--f-head:"Outfit",Arial,"Liberation Sans",Helvetica,sans-serif;
  --accent:#4f46e5;--accent-ink:#fff;--accent-soft:#ecebff;--focus:#4f46e5;--cy:#0d9488;--cy-soft:rgba(13,148,136,.13);
  --ink:#0f172a;--muted:#566176;--line:#e1e5f0;--surface2:#eef1f8;
  --rail:#0a1030;--rail-hover:#161d4a;--rail-line:#232b63;--rail-accent:#a5b4fc;--hero:#0a1030;--hero2:#26298f;
  --d-corp:#3b82f6;--d-reg:#8b5cf6;--d-net:#0d9488;--d-flow:#f59e0b;--d-biz:#16a34a;--d-fin:#ec4899;--d-scm:#64748b;--d-it:#06b6d4;--d-ops:#d97706}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080c1a;--surface:#0f1530;--surface2:#171e42;--ink:#e8ecfa;--muted:#9aa5c4;--line:#252e5a;--accent:#8b8cff;--accent-ink:#0a0d24;--accent-soft:#1e2358;--focus:#a5b4fc;--cy:#2dd4bf;--cy-soft:rgba(45,212,191,.14)}}
:root[data-theme="dark"]{--bg:#080c1a;--surface:#0f1530;--surface2:#171e42;--ink:#e8ecfa;--muted:#9aa5c4;--line:#252e5a;--accent:#8b8cff;--accent-ink:#0a0d24;--accent-soft:#1e2358;--focus:#a5b4fc;--cy:#2dd4bf;--cy-soft:rgba(45,212,191,.14)}
:root:not([data-theme="dark"]){--bg:#f3f5fc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080c1a}}
body{background-image:radial-gradient(1000px 520px at 90% -10%,rgba(79,70,229,.12),transparent 62%),radial-gradient(800px 480px at -10% 8%,rgba(13,148,136,.09),transparent 58%)}
h1::after{background:linear-gradient(90deg,var(--accent),var(--cy));width:56px}
.eyebrow{color:var(--accent)}
.side{background:linear-gradient(190deg,#0e1547 0%,#0a1030 50%,#070a22 100%)}
.nav[aria-current="page"]{background:linear-gradient(90deg,rgba(139,140,255,.22),rgba(139,140,255,.06))}
.nav[aria-current="page"]::before{background:linear-gradient(180deg,#a5b4fc,#2dd4bf)}
.logo{box-shadow:0 12px 30px -8px rgba(99,102,241,.6),0 0 0 1px rgba(255,255,255,.5)}
.btn.primary{background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 10px 22px -10px rgba(79,70,229,.8)}
.btn.primary:hover{box-shadow:0 14px 26px -10px rgba(79,70,229,.85)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(79,70,229,.2)}}
.hero{background:linear-gradient(125deg,#0a1030 0%,#1a1f6e 55%,#3d2fb8 100%);box-shadow:0 26px 60px -28px rgba(55,48,163,.8),inset 0 1px 0 rgba(255,255,255,.1)}
.hero::after{background:radial-gradient(60% 90% at 80% 40%,rgba(45,212,191,.16),transparent 70%),linear-gradient(90deg,rgba(10,16,48,.5) 0%,rgba(10,16,48,0) 55%)}
.hero .eyebrow,.hcopy .eyebrow{color:#7dd3fc!important}
.trust span::before{background:#2dd4bf;box-shadow:0 0 8px #2dd4bf}
.composer form:focus-within{border-color:var(--accent);box-shadow:0 14px 40px -16px rgba(55,48,163,.45),0 0 0 4px var(--accent-soft)}
.srcchip:hover,.rel button:hover{border-color:var(--accent);color:var(--accent)}
.trustpill{background:var(--cy-soft);color:var(--cy)}
/* --- bento blocks --- */
.empty{grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.empty>*{grid-column:1/-1}
.empty>.hero{grid-column:span 8;margin:0}
.empty>.live{grid-column:span 4}
.how{display:contents}
.how .step{grid-column:span 4;color:#fff;border:0;padding:20px 20px 20px 20px;min-height:132px;overflow:hidden;background:linear-gradient(140deg,#4f46e5,#2f2a9d);box-shadow:0 18px 34px -20px rgba(55,48,163,.9)}
.how .step:nth-child(2){background:linear-gradient(140deg,#0d9488,#0b5f68);box-shadow:0 18px 34px -20px rgba(13,148,136,.9)}
.how .step:nth-child(3){background:linear-gradient(140deg,#f59e0b,#c2410c);box-shadow:0 18px 34px -20px rgba(217,119,6,.9)}
.how .step b{font-size:16px;color:#fff;margin-top:34px}
.how .step span{color:rgba(255,255,255,.86)}
.how .step .n{left:auto;right:14px;top:6px;width:auto;height:auto;background:none;box-shadow:none;font:800 64px/1 var(--f-head);color:rgba(255,255,255,.2);transform:none}
.live{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:12px;align-content:start;box-shadow:0 18px 34px -26px rgba(15,23,42,.5)}
.live h3{font-size:16px}
.mini{display:grid;grid-template-columns:96px 1fr 38px;gap:10px;align-items:center;font-size:12.5px}
.mini span{display:flex;gap:7px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.mini .bar i{display:block;height:100%;border-radius:99px;animation:grow2 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow2{from{width:0!important}}
.mini b{font:600 12.5px var(--f-mono);text-align:right}
.starters{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.starters .starter{position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--dc) 35%,var(--line));border-radius:14px;padding:16px 16px 16px 18px;background:linear-gradient(150deg,color-mix(in srgb,var(--dc) 15%,var(--surface)) 0%,var(--surface) 70%);min-height:96px;font-weight:500}
.starters .starter::after{content:"";position:absolute;right:-18px;bottom:-18px;width:70px;height:70px;border-radius:18px;background:var(--dc);opacity:.16;transform:rotate(18deg)}
.starters .starter:hover{border-color:var(--dc);box-shadow:0 18px 30px -18px color-mix(in srgb,var(--dc) 70%,#000)}
.deptgrid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.deptgrid .dept{border:0;border-radius:16px;min-height:132px;padding:16px 18px;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--dc) 80%,#000),color-mix(in srgb,var(--dc) 42%,#000));box-shadow:0 18px 30px -20px color-mix(in srgb,var(--dc) 80%,#000);overflow:hidden}
.deptgrid .dept::before{display:none}
.deptgrid .dept::after{content:"";position:absolute;right:-26px;top:-26px;width:100px;height:100px;border-radius:26px;background:rgba(255,255,255,.12);transform:rotate(22deg)}
.deptgrid .dept .big{font-size:34px;font-weight:800}.deptgrid .dept .big small,.deptgrid .dept .poc{color:rgba(255,255,255,.78)}
.deptgrid .dept .dot{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.deptgrid .dept.zero{background:linear-gradient(145deg,color-mix(in srgb,var(--dc) 14%,var(--surface)),var(--surface));border:1.5px dashed color-mix(in srgb,var(--dc) 45%,var(--line));color:var(--ink);box-shadow:none}
.deptgrid .dept.zero::after{background:var(--dc);opacity:.1}
.deptgrid .dept.zero .big small,.deptgrid .dept.zero .poc{color:var(--muted)}.deptgrid .dept.zero .dot{background:var(--dc);box-shadow:none}
.deptgrid .dept[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--accent),0 18px 30px -16px rgba(0,0,0,.5)}
.kpis{gap:14px}
.kpi{border:0;color:#fff;padding:18px 18px 16px;background:linear-gradient(145deg,color-mix(in srgb,var(--kc) 85%,#000),color-mix(in srgb,var(--kc) 45%,#000));box-shadow:0 18px 30px -20px color-mix(in srgb,var(--kc) 85%,#000)}
.kpi::before{display:none}.kpi::after{content:"";position:absolute;right:-20px;bottom:-24px;width:84px;height:84px;border-radius:22px;background:rgba(255,255,255,.13);transform:rotate(20deg)}
.kpi b{font-size:34px;font-weight:800}.kpi span{color:rgba(255,255,255,.85)}
.card{border-radius:16px}
.covgrid .cov{border-top:0;position:relative;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--dc) 9%,var(--surface)),var(--surface) 38%)}
.covgrid .cov::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--dc)}
@media (max-width:900px){.empty>.hero,.empty>.live{grid-column:1/-1}.how .step{grid-column:1/-1;min-height:0}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .live,:root:not([data-theme="light"]) .card{box-shadow:none}}

/* ======== v8: executive palette (navy / steel / brass) ======== */
:root{--accent:#1d4e89;--accent-soft:#e6eef8;--focus:#1d4e89;--cy:#1d6f8a;--cy-soft:rgba(29,111,138,.12);--gold:#b8923f;
  --ink:#0d1b2e;--muted:#52627a;--line:#dde3ec;--surface2:#eef2f7;
  --rail:#0a1a30;--rail-hover:#12294a;--rail-line:#1e3556;--rail-accent:#d4af61;--hero:#0a1a30;--hero2:#15365f;
  --d-corp:#2f6db5;--d-reg:#6552ad;--d-net:#17807a;--d-flow:#b7832f;--d-biz:#3f8a52;--d-fin:#a8557c;--d-scm:#5b6b80;--d-it:#2a86a8;--d-ops:#9a6e3a}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070f1c;--surface:#0e1a2e;--surface2:#152540;--line:#223555;--accent:#6ea8e6;--accent-ink:#06101e;--accent-soft:#16294a;--focus:#8fbcf0;--cy:#5cb6d1;--cy-soft:rgba(92,182,209,.14);--muted:#9bacc6;--ink:#e6edf7}}
:root[data-theme="dark"]{--bg:#070f1c;--surface:#0e1a2e;--surface2:#152540;--line:#223555;--accent:#6ea8e6;--accent-ink:#06101e;--accent-soft:#16294a;--focus:#8fbcf0;--cy:#5cb6d1;--cy-soft:rgba(92,182,209,.14);--muted:#9bacc6;--ink:#e6edf7}
body{background-image:radial-gradient(1000px 520px at 90% -10%,rgba(29,78,137,.10),transparent 62%),radial-gradient(800px 480px at -10% 8%,rgba(184,146,63,.07),transparent 58%)}
h1::after{background:linear-gradient(90deg,#b8923f,#e3c77f);width:52px}
.side{background:linear-gradient(190deg,#0d2038 0%,#0a1a30 52%,#06111f 100%)}
.nav[aria-current="page"]{background:linear-gradient(90deg,rgba(212,175,97,.18),rgba(212,175,97,.04))}
.nav[aria-current="page"]::before{background:linear-gradient(180deg,#e3c77f,#b8923f)}

/* ======== v15: enterprise design system ======== */
:root{--r-sm:6px;--r:10px;--r-lg:14px;--sh1:0 1px 2px rgba(16,24,40,.06);--sh2:0 4px 14px -6px rgba(16,24,40,.14);--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px}
body{background-image:none;font-size:14.5px;line-height:1.55}
h1{font-size:26px!important;line-height:1.2;letter-spacing:-.015em;font-weight:700}
h2{font-size:16px;letter-spacing:-.005em;font-weight:650}
.pagehead h1::after,.pagehead::after{display:none!important}
.pagehead h1+*{}
.pagehead .eyebrow{color:var(--muted);letter-spacing:.1em;font-size:11px}
.pagehead p{font-size:14px;margin-top:6px}
#main{padding-top:26px}
/* cards */
.card{border-radius:var(--r);box-shadow:var(--sh1);border:1px solid var(--line);background:var(--surface)}
.chead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.chead h2{margin:0}
/* buttons */
.btn{border-radius:8px;font-weight:550;box-shadow:var(--sh1)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:var(--sh1)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.ok{background:var(--ok-soft);color:var(--ok)}
/* flat KPI cards (replaces gradient tiles) */
.kpi{background:var(--surface)!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:var(--r)!important;box-shadow:var(--sh1)!important;padding:14px 16px!important}
.kpi::before{display:block!important;width:3px!important;background:var(--kc)!important}.kpi::after{display:none!important}
.kpi b{font-size:28px!important;font-weight:700!important;color:var(--ink)}.kpi span{color:var(--muted)!important}
.kpis{gap:12px}
.kpis2{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi2{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi2 .kl{font-size:12.5px;color:var(--muted);font-weight:550}
.kpi2 b{font:700 28px/1.1 var(--f-head);letter-spacing:-.02em;color:var(--ink)}.kpi2 b small{font-size:16px;color:var(--muted);font-weight:600}
.kpi2 .ks{font-size:12px;color:var(--muted)}

/* ======== v19: typography system (single source of truth for text) ======== */
:root{
 --f-body:"Outfit",Arial,"Liberation Sans",Helvetica,sans-serif;
 --f-head:var(--f-body);
 --f-mono:"Outfit",Arial,"Liberation Sans",Helvetica,sans-serif;
 /* scale */
 --fs-title:clamp(24px,1.1vw + 18px,30px);   /* page title */
 --fs-h2:20px;                                 /* section heading */
 --fs-h3:16px;                                 /* card / module heading */
 --fs-h4:14px;                                 /* sub-heading inside content */
 --fs-read:15px;                               /* long-form reading text */
 --fs-body:14px;                               /* interface body text */
 --fs-table:13.5px;
 --fs-nav:14px;
 --fs-label:13px;
 --fs-support:12.5px;
 --fs-meta:11.5px;
 --fs-kpi:28px;
 /* rhythm */
 --lh-title:1.2;--lh-head:1.3;--lh-body:1.55;--lh-read:1.65;--lh-tight:1.35;
 --fw-reg:400;--fw-med:500;--fw-semi:600;--fw-bold:700;
 --ls-title:-.02em;--ls-h2:-.012em;--ls-h3:-.006em;--ls-caps:.08em;
 --measure:70ch;
 --gap-title:8px;--gap-head:6px;--gap-block:16px;--gap-section:28px;
}
@media (max-width:700px){:root{--fs-h2:18px;--fs-kpi:24px}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--f-body);font-size:var(--fs-body);line-height:var(--lh-body);font-weight:var(--fw-reg);letter-spacing:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-kerning:normal}
button,input,select,textarea{font-family:var(--f-body)}
/* numerals: tabular wherever figures are compared or aligned */
.kpi b,.kpi2 b,.gs b,.hstat b,.hb b,.c3 .v,.mini b,.stat b,.nav .cnt,.pill,.ref,.cite,.mono,.srctable td,.srctable th,.deptgrid .dept .big,.ring text,.mark,.lbls span,.livetag,.srcchip,.bdg,time{font-variant-numeric:tabular-nums}

/* ---- 1. page header: eyebrow, title, description ---- */
#main .pagehead{margin-bottom:var(--gap-section);align-items:flex-end}
#main .pagehead .eyebrow,#main .eyebrow{font:var(--fw-semi) var(--fs-meta)/1.3 var(--f-body);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--muted);margin:0 0 var(--gap-head)}
#main h1{font:var(--fw-bold) var(--fs-title)/var(--lh-title) var(--f-body)!important;letter-spacing:var(--ls-title);margin:0}
#main .pagehead p{font-size:14.5px;line-height:var(--lh-body);color:var(--muted);max-width:62ch;margin:var(--gap-title) 0 0}

/* ---- 2. headings ---- */
#main h2{font:var(--fw-semi) var(--fs-h2)/var(--lh-head) var(--f-body);letter-spacing:var(--ls-h2);margin:0 0 var(--gap-head)}
#main .card :is(h2,h3),#main .chead :is(h2,h3){font:var(--fw-semi) var(--fs-h3)/var(--lh-tight) var(--f-body);letter-spacing:var(--ls-h3);margin:0}
#main h3{font:var(--fw-semi) var(--fs-h3)/var(--lh-tight) var(--f-body);letter-spacing:var(--ls-h3);margin:0}
#main h4{font:var(--fw-semi) var(--fs-h4)/1.4 var(--f-body);margin:0}
#main .chead{margin-bottom:var(--gap-block)}
#main .chead p,#main .card>p.muted,#main .card .sub{font-size:var(--fs-support);line-height:1.5;color:var(--muted);margin:4px 0 0;font-weight:var(--fw-reg)}
#main .phases>section>h2,#main .phase-h{margin-bottom:var(--gap-head)}
#main .phases>section>p{font-size:14px;color:var(--muted);max-width:68ch;margin:0 0 var(--gap-block)}

/* ---- 3. body, supporting text, metadata ---- */
.muted,.hint,.foot,small{line-height:1.45}
.hint,.foot{font-size:var(--fs-support)}
.meta{font-size:var(--fs-support);line-height:1.45;font-weight:var(--fw-reg);color:var(--muted);gap:4px 16px}
.meta b{font-weight:var(--fw-semi);color:var(--ink)}
.meta .ml{font-style:normal;font-weight:var(--fw-med);font-size:var(--fs-meta);color:var(--muted);margin-right:6px}
.meta>span{color:var(--ink)}

/* ============================================================ retrieval (BM25 + acronym/synonym expansion) */
function stem(w){
  if(w.length>5){ if(w.endsWith('ing'))w=w.slice(0,-3); else if(w.endsWith('ies'))w=w.slice(0,-3)+'y'; else if(w.endsWith('ed'))w=w.slice(0,-2); else if(w.endsWith('es'))w=w.slice(0,-2); else if(w.endsWith('s')&&!w.endsWith('ss'))w=w.slice(0,-1); }
  else if(w.length>3&&w.endsWith('s')&&!w.endsWith('ss')) w=w.slice(0,-1);
  if(w.length>4&&w.endsWith('e'))w=w.slice(0,-1);
  return w;
}
function rawTokens(s){
  s=String(s).toLowerCase().replace(/fiber\s*@\s*home|fiber\s*at\s*home|fiberathome|fiber home|fhl/g,' fiberhome ').replace(/[’']s\b/g,'').replace(/[^a-z0-9ঀ-৿]+/g,' ');
  return s.split(' ').filter(Boolean).map(w=>NORM[w]||w);
}
function toks(s){return rawTokens(s).filter(w=>!STOP.has(w)).map(stem)}
function buildIndex(){
  const df=new Map(); let tot=0;
  for(const d of ALL){
    const tf=new Map(); let len=0;
    const add=(arr,w)=>{for(const t of arr){tf.set(t,(tf.get(t)||0)+w);len+=w}};
    const tt=toks(d.t); add(tt,3); add(toks(d.c+' '+d.s),1.2); const bt=toks(d.b); add(bt,1); add(toks(dept(d.d).name),.4);
    d._tf=tf; d._len=len; d._str=' '+tt.join(' ')+' '+bt.join(' ')+' '; d._tstr=' '+tt.join(' ')+' ';
    for(const t of tf.keys()) df.set(t,(df.get(t)||0)+1);
    tot+=len;
  }
  IDX={df,N:ALL.length,avg:tot/Math.max(1,ALL.length)};
}
function expandQuery(q){
  const raw=rawTokens(q), qs=new Map(), low=' '+raw.join(' ')+' ';
  const put=(t,w)=>{if(t&&!STOP.has(t)){const s=stem(t);qs.set(s,Math.max(qs.get(s)||0,w))}};
  raw.forEach(t=>put(t,1));
  if(raw.some(t=>['our','we','us','company','organization','organisation'].includes(t)))put('fiberhome',.6);
  for(const t of raw){
    if(ACR[t]) rawTokens(ACR[t]).forEach(x=>put(x,.55));
    if(SYN[t]) rawTokens(SYN[t]).forEach(x=>put(x,.5));
  }
  for(const [a,p] of Object.entries(ACR)){ if(a.length>2 && low.includes(' '+rawTokens(p).slice(0,3).join(' ')+' ')) put(a,.9); }
  return {terms:qs,bigrams:(()=>{const t=toks(q),o=[];for(let i=0;i<t.length-1;i++)o.push(t[i]+' '+t[i+1]);return o})()};
}
function search(q,{scope='all',limit=10,dept:onlyDept=null}={}){
  if(!IDX||!q.trim())return [];
  const {terms,bigrams}=expandQuery(q), k1=1.2,b=.6, out=[], qcore=[...new Set(toks(q))];
  const sc = onlyDept||scope;
  for(const d of ALL){
    if(d.st==='archived')continue;
    if(sc!=='all'&&d.d!==sc)continue;
    let s=0;
    for(const [t,w] of terms){
      const f=d._tf.get(t); if(!f)continue;
      const n=IDX.df.get(t)||0, idf=Math.log(1+(IDX.N-n+.5)/(n+.5));
      s+=w*idf*f*(k1+1)/(f+k1*(1-b+b*d._len/IDX.avg));
    }
    if(!s)continue;
    if(!d._ts)d._ts=new Set(toks(d.t));
    if(qcore.length){let n=0;qcore.forEach(t=>{if(d._ts.has(t))n++});const ov=n/qcore.length;if(ov>=.6)s+=3*ov}
    for(const bg of bigrams){ if(d._tstr.includes(' '+bg+' '))s+=2.2; else if(d._str.includes(' '+bg+' '))s+=1; }
    if(d.upd)s*=1.25;
    out.push({e:d,s});
  }
  out.sort((a,b)=>b.s-a.s);
  const top=out[0]?.s||0;
  return out.filter(x=>x.s>=top*.3).slice(0,limit);
}

function fmtRecord(h){
  /* presentation only: structures already-escaped text into paragraphs, labelled lines, sub-headings and lists; never changes wording */
  const out=[]; let open=false;
  const close=()=>{if(open){out.push('</ul>');open=false}};
  const lab=s=>{const i=s.indexOf(': ');if(i>1&&i<=48){const l=s.slice(0,i);if(/^[A-Z0-9(]/.test(l)&&!/[<>]|\.\s|\/\//.test(l)&&l.split(/\s+/).length<=7)return '<b class="lab">'+l+':</b> '+s.slice(i+2)}return s};
  const item=(mk,t)=>{if(!open){out.push('<ul class="rl">');open=true}out.push('<li><span class="mk">'+mk+'</span><span>'+lab(t)+'</span></li>')};
  for(const raw of String(h).split('\n')){
    const ln=raw.trim(); let m;
    if(!ln){close();continue}
    if((m=ln.match(/^[-•*]\s+(.*)$/)))item('•',m[1]);
    else if((m=ln.match(/^(\d{1,2}[.)]|[a-h][.)])\s+(.*)$/)))item(m[1],m[2]);
    else if(ln.endsWith(':')&&ln.length<=90&&ln.split(/\s+/).length<=10){close();out.push('<h4 class="rh">'+ln+'</h4>')}
    else{close();out.push('<p>'+lab(ln)+'</p>')}
  }
  close(); return out.join('');
}
function md(text){
  let h=esc(text);
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=fmtRecord(h);
  h=h.replace(/\[((?:S\d{3}|U_[\w.~:@+-]+)(?:\s*[,;]\s*(?:S\d{3}|U_[\w.~:@+-]+))*)\]/g,(m,ids)=>ids.split(/\s*[,;]\s*/).map(id=>BYID.has(id)?`<button class="cite" data-cite="${id}" title="${esc(BYID.get(id).t)}">${id.startsWith('U_')?'update':id}</button>`:'').join(''));
  return h;
}

async function logGap(q,sq){
  if(!S.dbOk||!S.db)return;
  try{
    const norm=q.toLowerCase().replace(/\W+/g,' ').trim();
    if(S.gaps.some(g=>g.status==='open'&&g.norm===norm))return;
    const top=search(sq||q,{limit:1})[0];
    await S.db.collection('gaps').add({q,norm,status:'open',at:new Date().toISOString(),dept:top?top.e.d:'',scope:S.scope});
  }catch(e){}
}

function drawVault(){
  const V=S.vault, box=$('#vres'); if(!box)return;
  let list;
  const pass=e=>e.st!=='archived'&&(V.dept==='all'||e.d===V.dept)&&(V.kind==='all'||(V.kind==='upd'?e.upd:e.k===V.kind||(V.kind==='qa'&&false)));
  if(V.q.trim()){
    const res=search(V.q,{scope:V.dept,limit:60}).filter(x=>pass(x.e));
    const terms=[...expandQuery(V.q).terms.keys()].filter(t=>t.length>2);
    const re=terms.length?new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'):null;
    const hl=s=>re?esc(s).replace(re,'<mark>$1</mark>'):esc(s);
    box.innerHTML=res.length?`<div class="card"><div class="meta" style="margin-bottom:6px">${res.length} best match${res.length>1?'es':''}</div>${res.map(x=>entryHtml(x.e,hl)).join('')}</div>`:`<div class="empty-note">No entries match "${esc(V.q)}". Try a different word, or add the information in the Update Center.</div>`;

  let h='';

    }
  }
  box.innerHTML=h;
}
function fillComp(det){
  const body=$('.cbody',det); if(body.dataset.done)return; body.dataset.done=1;

async function structure(){
  const raw=($('#raw').value||'').trim(); if(!raw){toast('Paste some notes first');return}
  const src=($('#rawsrc').value||'').trim();
  S.uc.intakeBusy=true; drawUC(); $('#raw').value=raw; $('#rawsrc').value=src;
  const deptList=DEPTS.map(d=>`${d.id} = ${d.name}`).join('\n');
  const prompt=`You turn raw company notes into clean knowledge-base entries for Fiber@Home Limited's Knowledge Vault.\n\nRules:\n- Split the notes into separate atomic entries, one fact or topic per entry.\n- Use ONLY what is in the notes. Never invent or "improve" facts. Keep every name, number, fee and date exactly as written.\n- "title": write it as the question an employee would ask (e.g. "Who is the Head of Finance?"), or a short descriptive title.\n- "body": a complete, self-contained answer or statement that makes sense without the notes.\n- "dept": one id from the list below, or a short new department name if none fits.\n- "comp": the best topic. Prefer one of these exactly: ${P1.map(c=>c.n).join(' | ')}; otherwise a short topic name.\n\nDepartments:\n${deptList}\n\nReply with only a JSON array of objects: [{"dept":"hr","title":"…","body":"…","comp":"…"}]\n\nNOTES:\n"""\n${raw.slice(0,20000)}\n"""`;
  try{
    const arr=await S.sample.json(prompt,{cache:false});
    const L=(Array.isArray(arr)?arr:[]).filter(x=>x&&x.title&&x.body).slice(0,40);
    S.uc.drafts=L.map(x=>({dept:DEPTS.some(d=>d.id===x.dept)?x.dept:(DEPTS.find(d=>d.name.toLowerCase()===String(x.dept).toLowerCase())?.id||String(x.dept||'Other')),title:String(x.title),body:String(x.body),comp:String(x.comp||'General'),src:src||'Pasted notes',sel:true}));

}
async function publishDrafts(){

function cmdk(open){
  let el=$('#cmdk'); if(el){el.remove();if(!open)return}
  const _prev=document.activeElement;el=document.createElement('div'); el.id='cmdk'; el.innerHTML='<div class="box" role="dialog" aria-modal="true" aria-label="Search the vault"><input id="ck-q" role="combobox" aria-expanded="true" aria-controls="ck-l" aria-autocomplete="list" placeholder="Search entries, or type a question…" autocomplete="off" aria-label="Search entries or type a question"><div class="list" id="ck-l" role="listbox" aria-label="Results"></div><div class="ft"><span>&#8593;&#8595; navigate</span><span>Enter open</span><span>Esc close</span></div></div>';
  document.body.appendChild(el);
  const inp=$('#ck-q'), list=$('#ck-l'); let items=[],sel=0;
  const draw=()=>{
    const q=inp.value.trim(); items=[];
    if(q){items.push({k:'ask',t:'Ask the assistant: '+q,s:'Get a sourced answer from the vault',q});
      search(q,{limit:7}).forEach(x=>items.push({k:'e',e:x.e}))}
    else{NAV.forEach(([id,l])=>items.push({k:'go',id,t:'Go to '+l}));STARTERS.slice(0,4).forEach(([d,t])=>items.push({k:'ask',t,s:'Suggested question',q:t,d}))}
    sel=Math.min(sel,items.length-1);
    inp.setAttribute('aria-activedescendant','ck-o'+sel);
    list.innerHTML=(q?'':'<div class="hd">Quick actions</div>')+items.map((x,i)=>{
      const dot=x.k==='e'?deptTag(x.e.d):x.d?deptTag(x.d):'<span class="dot"></span>';
      const t=x.k==='e'?x.e.t:x.t, s=x.k==='e'?(dept(x.e.d).name+' · '+x.e.b.slice(0,110)+'…'):(x.s||'');
      return `<button class="it" role="option" id="ck-o${i}" data-ci="${i}" aria-selected="${i===sel}">${dot}<div><b>${esc(t)}</b>${s?`<span class="s">${esc(s)}</span>`:''}</div></button>`}).join('');
  };
  const close=()=>{el.remove();if(_prev&&_prev.isConnected&&_prev.focus)_prev.focus()};
  const run=i=>{const x=items[i];if(!x)return;el.remove();if(x.k==='e')openEntry(x.e.id);else if(x.k==='ask'){go('chat');ask(x.q)}else go(x.id)};
  inp.addEventListener('input',()=>{sel=0;draw()});
  inp.addEventListener('keydown',e=>{
    if(e.key==='Escape'){close()}
    else if(e.key==='Tab'){e.preventDefault()}
    else if(e.key==='ArrowDown'){e.preventDefault();sel=(sel+1)%items.length;draw();list.querySelector('[aria-selected="true"]')?.scrollIntoView({block:'nearest'})}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=(sel-1+items.length)%items.length;draw();list.querySelector('[aria-selected="true"]')?.scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'){e.preventDefault();run(sel)}
  });
  list.addEventListener('click',e=>{const b=e.target.closest('[data-ci]');if(b){e.stopPropagation();run(+b.dataset.ci)}});
  el.addEventListener('mousedown',e=>{if(e.target===el)close()});
  draw(); inp.focus();
}

        if(r.status===503){oerr('One-time code sign-in is not set up on the server yet. Use your access code, or contact IT.');return}
        if(!r.ok){oerr(r.status===422?'That email address is not valid.':'We could not send the code. Please try again in a moment.');return}
        const j=await r.json();O.ttl=j.ttl_minutes||10;O.resend=j.resend_after||30;O.demo=null;
      }else if(!STANDALONE){
        O.demo={code:String(crypto.getRandomValues(new Uint32Array(1))[0]%1000000).padStart(6,'0'),exp:Date.now()+600000,tries:0};O.ttl=10;O.resend=30;
      }else{oerr('One-time code sign-in needs the Knowledge Vault server, which this file is not connected to. Use your access code.');return}
      O.email=em;clearBoxes();
      $('#o-p').innerHTML='If <b></b> has access, a 6-digit code is on its way. It expires in '+O.ttl+' minutes.';$('#o-p b').textContent=em;
      const dm=$('#o-demo');if(O.demo){dm.innerHTML='<b>Preview mode.</b> No email is sent because this preview is not connected to the Knowledge Vault server. Your code is <b class="dc"></b>.';dm.querySelector('.dc').textContent=O.demo.code;dm.hidden=false}else dm.hidden=true;
      showStep('code');tick();announce('A 6-digit code was requested for '+em);
    }catch(x){oerr('We could not reach the server. Check your connection and try again.')}
    finally{busy(btn,false);if(resend)tick()}
  }
  async function otpVerify(){
    if(O.busy)return;oerr('');const code=boxes.map(b=>b.value).join('');boxes.forEach(b=>b.removeAttribute('aria-invalid'));
    if(code.length<6){boxes.forEach(b=>{if(!b.value)b.setAttribute('aria-invalid','true')});oerr('Enter all 6 digits of the code.');(boxes.find(b=>!b.value)||boxes[0]).focus();return}
    const btn=$('#o-verify');busy(btn,true);let user=null;
    const fail=m=>{oerr(m);clearBoxes();boxes.forEach(b=>b.setAttribute('aria-invalid','true'));boxes[0].focus()};
    try{
      if(O.server){
        const r=await fetch(API+'/api/auth/otp/verify',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email:O.email,code})});
        const j=await r.json().catch(()=>({}));
        if(!r.ok){fail(typeof j.detail==='string'?j.detail:'That code is incorrect or has expired. Check the code or request a new one.');return}
        window.FHL_CSRF=j.csrf_token;user={email:O.email,name:j.name||nameFrom(O.email)};
      }else{
        const d=O.demo;
        if(!d||Date.now()>d.exp){fail('That code has expired. Request a new one.');return}
        if(d.tries>=5){fail('Too many incorrect codes. Request a new code.');return}
        if(code!==d.code){d.tries++;fail('That code is incorrect. '+Math.max(0,5-d.tries)+' attempt'+(5-d.tries===1?'':'s')+' left.');return}
        user={email:O.email,name:nameFrom(O.email)};
      }
      finishLogin(user,$('#o-rem').checked,btn);
    }catch(x){oerr('We could not reach the server. Check your connection and try again.')}
    finally{if(!user)busy(btn,false)}
  }
  boxes.forEach((b,i)=>{
    b.addEventListener('input',()=>{const d=b.value.replace(/\D/g,'');if(d.length>1){[...d.slice(0,6)].forEach((c,k)=>{if(boxes[i+k])boxes[i+k].value=c});boxes[Math.min(i+d.length,5)].focus()}else{b.value=d;if(d&&i<5)boxes[i+1].focus()}if(boxes.every(x=>x.value))otpVerify()});
    b.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!b.value&&i>0){boxes[i-1].value='';boxes[i-1].focus()}else if(e.key==='ArrowLeft'&&i>0){e.preventDefault();boxes[i-1].focus()}else if(e.key==='ArrowRight'&&i<5){e.preventDefault();boxes[i+1].focus()}else if(e.key==='Enter'){e.preventDefault();otpVerify()}});
    b.addEventListener('paste',e=>{const t=((e.clipboardData&&e.clipboardData.getData('text'))||'').replace(/\D/g,'').slice(0,6);if(!t)return;e.preventDefault();[...t].forEach((c,k)=>boxes[k].value=c);boxes[Math.min(t.length,5)].focus();if(t.length===6)otpVerify()});
    b.addEventListener('focus',()=>b.select());
  });
  $('#o-verify').addEventListener('click',otpVerify);
  $('#o-diff').addEventListener('click',()=>{clearInterval(O.tm);O.demo=null;clearBoxes();oerr('');showStep('email')});
  $('#o-resend').addEventListener('click',()=>otpSend(true));
  try{fetch(API+'/api/auth/methods',{credentials:'include',signal:(AbortSignal.timeout?AbortSignal.timeout(1800):undefined)}).then(r=>r.ok&&/json/.test(r.headers.get('content-type')||'')?r.json():null).then(j=>{if(j&&j.otp){O.server=true;if(!O.touched&&el.dataset.tab!=='otp')setTab('otp',false)}}).catch(()=>{})}catch(x){}
  $('#loginform').addEventListener('submit',e=>{
    e.preventDefault();if(el.dataset.tab==='otp'){if($('#o-s1').hidden)otpVerify();else otpSend(false);return}const err=$('#l-err');let user;
    const bad=(id,msg)=>{el.querySelectorAll('input').forEach(x=>x.removeAttribute('aria-invalid'));const f=$('#'+id);f.setAttribute('aria-invalid','true');err.textContent='Error: '+msg;f.focus()};
    el.querySelectorAll('input').forEach(x=>x.removeAttribute('aria-invalid'));err.textContent='';
    if(STANDALONE){
      const em=$('#l-email').value.trim(),cd=$('#l-code').value;
      if(!em){bad('l-email','Enter your work email address, for example name@fiberathome.net.');return}
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){bad('l-email','That email address looks incomplete. Include the @ and the domain, for example name@fiberathome.net.');return}
      if(!cd){bad('l-code','Enter the access code you were given.');return}
      if(h53(cd)!==ACCESS_HASH){bad('l-code','That access code is not correct. Check for typing mistakes (it is case-sensitive), or choose Forgot access code.');$('#l-code').select();return}
      user={email:em,name:nameFrom(em)};
    }else{
      const n=$('#l-name').value.trim();if(n.length<2){bad('l-name','Enter your name (at least 2 letters) so we can greet you.');return}
      user={name:n};
    }
    finishLogin(user,$('#l-rem').checked,el.querySelector('#pane-code .go'));
  });
  const info=(m)=>{const b=$('#l-info');b.textContent=m;b.hidden=false};
  const fg=$('#l-forgot');if(fg)fg.addEventListener('click',()=>info('Access codes are issued by the Knowledge Vault owner. Please contact your department head or IT.'));
  $('#l-req').addEventListener('click',()=>info('To request access, ask your department head to approve you and contact the Knowledge Vault owner.'));
  el.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const f=[...el.querySelectorAll('button:not([disabled]),input,a[href]')].filter(x=>x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}});
  setStill(document.documentElement.classList.contains('still'),false);
  const eye=$('#l-eye');if(eye)eye.addEventListener('click',()=>{const i=$('#l-code');const s=i.type==='password';i.type=s?'text':'password';eye.setAttribute('aria-pressed',String(s));eye.setAttribute('aria-label',s?'Hide access code':'Show access code')});
  setTimeout(firstFocus,400);
}

  if(d.showvault){const e=BYID.get(d.showvault);closeDrawer();S.vault={dept:e.d,q:'',kind:'all'};go('vault');setTimeout(()=>{const det=document.querySelector(`details.comp[data-comp="${CSS.escape(e.c)}"]`);if(det){det.open=true;fillComp(det);const en=document.getElementById('en-'+e.id);if(en){en.open=true;en.scrollIntoView({block:'center'})}}},30);return}
  if(d.dept!==undefined&&t.classList.contains('dept')){S.vault.dept=d.dept;renderVault();return}
  if(d.export)return doExport(d.export);
  if(d.vaultcomp){S.vault={dept:d.vd,q:'',kind:'all'};go('vault');setTimeout(()=>{const det=document.querySelector(`details.comp[data-comp="${CSS.escape(d.vaultcomp)}"]`);if(det){det.open=true;det.scrollIntoView({block:'start'})}},30);return}
  if(d.addfor){S.uc.editing=null;go('update',{tab:'add',prefill:{dept:d.ad,comp:d.addfor}});return}
  if(d.confirm){const n=NOTES.find(x=>x.id===d.confirm);S.uc.editing=null;go('update',{tab:'add',prefill:{dept:n.d,comp:'',kind:'policy',title:'Confirmed: '+n.t,body:'',rep:n.x.split('. ')[0]}});return}
  if(d.tab){S.uc.tab=d.tab;S.uc.editing=null;renderUpdate();return}

  if(d.tick){ const [ci,bi]=d.tick.split('.').map(Number); const cur=bulletState(ci,bi); const nx={n:'p',p:'y',y:'n'}[cur]; const m={...S.cov,[d.tick]:nx}; try{await S.db.doc('coverage/state').set({m,updated:new Date().toISOString()})}catch(e){toast('Could not save the change')} return}
  if(d.edit){S.uc.editing=d.edit;S.uc.tab='add';renderUpdate();window.scrollTo(0,0);return}
  if(d.arch){const e=S.upd.find(x=>x._doc===d.arch);try{await S.db.doc('kb/'+d.arch).update({status:e.st==='archived'?'active':'archived',updated:new Date().toISOString()});toast(e.st==='archived'?'Restored':'Archived. The chatbot no longer uses it.')}catch(x){toast('Could not change the entry')}return}
  if(d.del){ if(!(await confirmDlg('Delete this entry?','This permanently removes the entry from the vault. This cannot be undone. Use Archive if you may need it later.','Delete entry')))return; try{await S.db.doc('kb/'+d.del).delete();toast('Entry deleted')}catch(x){toast('Could not delete. Please try again.')} return}

function localShim(){
  let store={};try{store=JSON.parse(localStorage.getItem('fhl-standalone-db')||'{}')}catch(e){}
  const subs=[],persist=()=>{try{localStorage.setItem('fhl-standalone-db',JSON.stringify(store))}catch(e){}},notify=()=>{persist();subs.forEach(f=>f())};
  const mkdoc=path=>({id:path.split('/').pop(),path,
    async get(){const d=store[path];return {id:this.id,exists:!!d,data:()=>d}},
    async set(d){store[path]=JSON.parse(JSON.stringify(d));notify()},
    async update(d){if(!store[path])throw {code:'invalid_argument'};store[path]=Object.assign({},store[path],d);notify()},
    async delete(){delete store[path];notify()},
    onSnapshot(n){const f=()=>{const d=store[path];n({id:this.id,exists:!!d,data:()=>d})};subs.push(f);setTimeout(f,0);return()=>{}}});
  const mkcol=path=>({path,doc(id){return mkdoc(path+'/'+(id||('d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6))))},
    async add(d){const r=this.doc();await r.set(d);return r},
    onSnapshot(n){const f=()=>{const depth=path.split('/').length+1;const docs=Object.keys(store).filter(k=>k.startsWith(path+'/')&&k.split('/').length===depth).map(k=>({id:k.split('/').pop(),data:()=>store[k]}));n({docs,size:docs.length,empty:!docs.length})};subs.push(f);setTimeout(f,0);return()=>{}}});
  return {doc:mkdoc,collection:mkcol};
}
async function caps(){
  if(STANDALONE){
    S.db=localShim();S.dbOk=true;S.sample=null;S.canEdit=true;
    S.downloads={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return {status:'saved'}}};
    const db=S.db;
    db.collection('kb').onSnapshot(snap=>{S.upd=snap.docs.map(d=>normUpd(d.id,d.data()));rebuild();renderNav();refreshView('kb')});
    db.doc('coverage/state').onSnapshot(s=>{S.cov=(s.exists&&s.data().m)||{};if(S.view==='coverage')renderCoverage()});
    db.collection('gaps').onSnapshot(snap=>{S.gaps=snap.docs.map(d=>({...d.data(),_id:d.id}));if(S.view==='update'&&S.uc.tab==='gaps')drawGaps()});
    if(S.view==='chat'&&!S.busy&&!$('#q')?.value)renderChat();else if(S.view!=='chat')render();
    return;
  }
  if(!(window.claude&&window.claude.use))return;
  const get=n=>window.claude.use(n).catch(()=>null);
  const [db,sample,user,dl]=await Promise.all([get('db'),get('sample'),get('user'),get('downloads')]);
  S.sample=sample; S.user=user; S.downloads=dl; S.db=db;
  try{S.canEdit=user?await user.canEdit():null}catch(e){S.canEdit=null}
  if(db){
    S.dbOk=true;
    db.collection('kb').onSnapshot(snap=>{S.upd=snap.docs.map(d=>normUpd(d.id,d.data()));rebuild();renderNav();refreshView('kb')},e=>{});
    db.doc('coverage/state').onSnapshot(s=>{S.cov=(s.exists&&s.data().m)||{};if(S.view==='coverage')renderCoverage()},e=>{});
    db.collection('gaps').onSnapshot(snap=>{S.gaps=snap.docs.map(d=>({...d.data(),_id:d.id}));if(S.view==='update'&&S.uc.tab==='gaps'){drawGaps()}if(S.view==='update'){const tb=document.querySelector('[data-tab="gaps"]');const n=S.gaps.filter(g=>g.status==='open').length;if(tb)tb.textContent='Unanswered questions'+(n?' ('+n+')':'')}},e=>{});
  }
  const sc=S.sample;
  if(S.view==='chat'&&!S.busy&&!$('#q')?.value){renderChat()} else if(S.view!=='chat'){render()}
  else{const so=$('#searchonly');if(so){so.disabled=!S.sample;so.checked=S.searchOnly||!S.sample}}
}
function refreshView(){
  if(S.view==='vault'){const open=[...document.querySelectorAll('details.comp[open]')].map(d=>d.dataset.comp);renderVault();open.forEach(c=>{const d=document.querySelector(`details.comp[data-comp="${CSS.escape(c)}"]`);if(d){d.open=true;fillComp(d)}})}
  else if(S.view==='coverage')renderCoverage();

  else if(S.view==='chat'&&!S.msgs.length&&!S.busy){drawMsgs()}
}
caps();
})();
